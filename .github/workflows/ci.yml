name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Go tests
        run: go test ./...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend; pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build Windows application
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          wails build -platform windows/amd64 -o WireDeck.exe

      - name: Prepare Windows runtime resources
        shell: pwsh
        run: |
          $bin = "build/bin"
          $pt = Join-Path $bin "platform-tools"
          New-Item -ItemType Directory -Force -Path $pt | Out-Null
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "$env:TEMP\pt.zip"
          Expand-Archive "$env:TEMP\pt.zip" -DestinationPath "$env:TEMP\pt" -Force
          Copy-Item "$env:TEMP\pt\platform-toolsdb.exe" $pt
          Copy-Item "$env:TEMP\pt\platform-tools\AdbWinApi.dll" $pt -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP\pt\platform-tools\AdbWinUsbApi.dll" $pt -ErrorAction SilentlyContinue

          $sc = Join-Path $bin "scrcpy"
          New-Item -ItemType Directory -Force -Path $sc | Out-Null
          Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip" -OutFile "$env:TEMP\scrcpy.zip"
          Expand-Archive "$env:TEMP\scrcpy.zip" -DestinationPath "$env:TEMP\scrcpy" -Force
          Copy-Item "$env:TEMP\scrcpy\scrcpy-win64-v5.0.1\*" $sc -Recurse -Force
          Remove-Item (Join-Path $sc "adb.exe") -ErrorAction SilentlyContinue

          Compress-Archive -Path "$bin\WireDeck.exe", $pt, $sc -DestinationPath "$bin\WireDeck-windows-amd64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireDeck-windows-amd64
          path: build/bin/WireDeck-windows-amd64.zip
          if-no-files-found: error
