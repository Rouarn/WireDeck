name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Go tests
        run: go test ./...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend; pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build Windows application
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          wails build -platform windows/amd64 -o WireDeck.exe

      - name: Prepare Windows runtime resources
        shell: pwsh
        run: |
          $bin = "build/bin"
          $pt = Join-Path $bin "platform-tools"
          New-Item -ItemType Directory -Force -Path $pt | Out-Null
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile (Join-Path $env:TEMP "pt.zip")
          Expand-Archive (Join-Path $env:TEMP "pt.zip") -DestinationPath (Join-Path $env:TEMP "pt") -Force
          $ptSrc = Join-Path $env:TEMP "pt/platform-tools"
          Copy-Item (Join-Path $ptSrc "adb.exe") $pt
          Copy-Item (Join-Path $ptSrc "AdbWinApi.dll") $pt -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $ptSrc "AdbWinUsbApi.dll") $pt -ErrorAction SilentlyContinue

          # aapt2 用于解析 APK 应用名，platform-tools 里没有，需要单独从 build-tools 取。
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/build-tools_r34-windows.zip" -OutFile (Join-Path $env:TEMP "bt.zip")
          Expand-Archive (Join-Path $env:TEMP "bt.zip") -DestinationPath (Join-Path $env:TEMP "bt") -Force
          $btDir = Get-ChildItem (Join-Path $env:TEMP "bt") -Directory | Select-Object -First 1
          Copy-Item (Join-Path $btDir.FullName "aapt2.exe") $pt
          Copy-Item (Join-Path $btDir.FullName "libwinpthread-1.dll") $pt -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $btDir.FullName "libc++_shared.dll") $pt -ErrorAction SilentlyContinue

          $sc = Join-Path $bin "scrcpy"
          New-Item -ItemType Directory -Force -Path $sc | Out-Null
          Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip" -OutFile (Join-Path $env:TEMP "scrcpy.zip")
          Expand-Archive (Join-Path $env:TEMP "scrcpy.zip") -DestinationPath (Join-Path $env:TEMP "scrcpy") -Force
          $scSrc = Join-Path $env:TEMP "scrcpy/scrcpy-win64-v5.0.1"
          Copy-Item (Join-Path $scSrc "*") $sc -Recurse -Force
          Remove-Item (Join-Path $sc "adb.exe") -ErrorAction SilentlyContinue

          Compress-Archive -Path (Join-Path $bin "WireDeck.exe"), $pt, $sc -DestinationPath (Join-Path $bin "WireDeck-windows-amd64.zip") -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WireDeck-windows-amd64
          path: build/bin/WireDeck-windows-amd64.zip
          if-no-files-found: error
